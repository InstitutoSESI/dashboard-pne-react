candidate_authorization:
  H1_DEMOGRAFIA_REDE:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2E, 2A]
    authorized_scope: Observed 2014-2025 cohort, enrollment and network changes; compatible decompositions, municipal contributions, RS comparison where the source supports it, and leave-one-out tests.
    limits: Missing complete network-by-stage class and urban-rural panels; lenses must remain separate; no projection.
  H2_TRAJETORIA_PERMANENCIA:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2A]
    authorized_scope: Approval, failure, dropout and age-grade distortion by compatible stage/network/year, with at most four pre-registered condition families.
    limits: Variable temporal coverage, unavailable components and non-reconstructible denominators constrain models and regional rates.
  H3_TRABALHO_JUVENIL_MEDIO:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2A, 2B, 2E]
    authorized_scope: Ecological comparison of observed secondary-school outcomes and formal youth-work measures, keeping RAIS stock and CAGED flows separate and testing lags 0-2 when coverage permits.
    limits: Formal work only; no same-person, first-employment or causal inference; no 2026.
  H4_EJA_DISTRIBUICAO:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2C]
    authorized_scope: Separate 2022 fundamental and secondary snapshots using canonical distribution formulas, plus the distinct 2014-2025 integrated-EJA context.
    limits: Mixed territorial lenses and single-year potential public; no coverage, demand, reach, sufficiency or individual-service claims.
  A1_COORTES_REDE:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2E]
    authorized_scope: Observed demographic transformation and observed network response, including municipalities moving against the regional direction.
    limits: No future enrollment numbers, municipal scenarios, extrapolation or school opening/closing recommendations.
  A2_TRABALHO_PERMANENCIA:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2A, 2B]
    authorized_scope: Formal-work transformation as the starting point, followed by compatible ecological education indicators and non-redundancy review against H3.
    limits: Formal work only; distinct workplace and school lenses; no causal or individual transition claim.
  A3_OCUPACOES_FORMACAO:
    state: AUTHORIZED_WITH_LIMITS
    source_subjobs: [2D]
    authorized_scope: Observed 2023-2025 technical-course supply, 2019-2025 occupations and the reproducible normative course-CBO bridge, with explicit zero and missingness semantics.
    limits: Bridge coverage is incomplete; correspondence is not adequacy; course enrollments are not entrants, graduates, vacancies or capacity.
