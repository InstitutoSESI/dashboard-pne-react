[project]
name = "dashboard-pne-data-pipeline"
version = "0.1.0"
description = "Pipeline de dados da plataforma municipal PNE"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.1",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "psycopg2-binary==2.9.12",
  "pypdf==6.14.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "sqlalchemy==2.0.51",
  "supabase==2.31.0",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
]

[tool.uv]
package = false
default-groups = []
